<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>体重記録</title>
<meta name="theme-color" content="#F6F7F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="体重記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F5; --card:#FFFFFF; --line:#E4E7E4; --line2:#F0F2F0;
  --ink:#16181A; --ink2:#3F4541; --mute:#5F6661;
  --acc:#0F766E; --acc-soft:#E3F1EF; --acc-ink:#134E4A;
  --up:#B45309; --up-soft:#FBEFE3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans JP',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}a:hover{color:#115E59}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#view{flex:1;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:calc(24px + env(safe-area-inset-top)) 20px 12px;gap:12px}
.hdr h1{margin:0;font-size:24px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.muted{color:var(--mute)}
.seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:#E9ECE9}
.seg button{min-height:32px;padding:0 11px;border-radius:8px;border:none;background:transparent;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pills{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:0 16px 14px}
.pills button{min-height:36px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink2);padding:0}
.pills button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:16px;border:none;background:var(--acc);color:#fff;font-size:16px;font-weight:700}
.primary:disabled{opacity:.45}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 20px 16px}
.stat{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-width:0}
.stat .l{font-size:12px;color:var(--mute)}
.stat .v{font-size:18px;font-weight:600}
.stat .u{font-size:12px;color:var(--mute);font-weight:500}
.note{margin:0 16px 14px;padding:12px 14px;border-radius:14px;background:var(--up-soft);color:#7C2D12;font-size:13px;line-height:1.5}

/* today */
.today{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow:hidden}
#view.t-today{padding-bottom:0}
html.t-today,html.t-today body{overflow:hidden;overscroll-behavior:none}
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:8px 24px}
.big{display:flex;align-items:baseline;gap:6px}
.big .n{font-size:104px;line-height:1;font-weight:600;letter-spacing:-4px}
.big .k{font-size:26px;font-weight:500;color:var(--mute)}
.diff{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{display:flex;justify-content:space-around;width:100%;max-width:480px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;min-height:48px;padding-top:4px;border:none;background:none;color:var(--mute);font-size:11px;font-weight:500}
.tabs button[aria-current="page"]{color:var(--acc);font-weight:700}

/* list */
.list{list-style:none;margin:0 16px;padding:0;overflow:hidden}
.list li+li{border-top:1px solid var(--line2)}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;border:none;background:none;text-align:left}
.row .d{display:flex;flex-direction:column;width:56px;flex:none}
.row .d b{font-size:15px;font-weight:600}
.row .d span{font-size:12px;color:var(--mute)}
.row .w{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row .w b{font-size:17px;font-weight:600}
.row .w span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .df{font-size:14px;font-weight:600}

/* calendar */
.cal{margin:0 16px;padding:12px}
.cal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--mute);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1.05;border:none;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;min-height:44px}
.cal button .dn{font-size:12px;color:var(--ink2)}
.cal button .dw{font-size:11px;font-weight:600}
.cal button.has{background:var(--acc-soft)}
.cal button.has .dw{color:var(--acc-ink)}
.cal button.td{outline:2px solid var(--acc);outline-offset:-2px}
.cal button:disabled{opacity:.35;cursor:default}

/* settings */
.sec{display:flex;flex-direction:column;gap:6px;padding:0 16px 18px}
.sec h2{margin:0 4px;font-size:13px;font-weight:600;color:var(--mute)}
.sgroup{overflow:hidden}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;padding:6px 16px}
.srow+.srow{border-top:1px solid var(--line2)}
.srow label,.srow .lab{font-size:15px}
.srow .sub{display:block;font-size:12px;color:var(--mute)}
.srow input{width:120px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;text-align:right;background:var(--bg);font-size:15px}
.srow input[type=date]{width:160px}
.unitwrap{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.sw{width:51px;height:31px;border-radius:16px;border:none;background:#D5D9D6;padding:2px;display:flex;justify-content:flex-start;flex:none}
.sw span{width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--acc);justify-content:flex-end}
.linkbtn{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:54px;padding:0 16px;border:none;background:none;font-size:15px;text-align:left}
.prog{height:10px;border-radius:5px;background:#ECEFEC;overflow:hidden}
.prog div{height:10px;border-radius:5px;background:var(--acc)}

/* sheet */
#back{position:fixed;inset:0;background:rgba(22,24,26,.45);display:flex;justify-content:center;align-items:flex-end;z-index:20}
#back[hidden]{display:none}
#sheet{width:100%;max-width:480px;max-height:100vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#D5D9D6}
.shd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shd .t{font-size:17px;font-weight:700}
.txtbtn{min-height:44px;padding:0 4px;border:none;background:none;font-size:15px;color:var(--mute)}
.datein{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--bg);font-size:14px;color:var(--acc);font-weight:600;max-width:150px}
.disp{display:flex;align-items:center;justify-content:space-between;padding:4px}
.round:disabled{opacity:.3;cursor:default}
.round{width:52px;height:52px;border-radius:26px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.dval{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.dval .big .n{font-size:72px;letter-spacing:-3px}
.dval .big .k{font-size:20px}
.dval .hint{font-size:13px;font-weight:600;min-height:18px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad button{height:52px;border-radius:12px;border:none;background:#F2F4F2;font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center}
.pad button:active{background:#E4E8E5}
.extra{display:flex;flex-direction:column;gap:8px}
.extra label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.extra label span{width:72px;flex:none}
.extra input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);font-size:15px}
.danger{min-height:44px;border:none;background:none;color:var(--up);font-size:14px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
.empty{padding:40px 24px;text-align:center;color:var(--mute);font-size:14px;line-height:1.7}
textarea.csv{width:100%;height:160px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;background:var(--bg)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="メインタブ"><div class="in">
  <button type="button" data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10a4 4 0 0 1 6 0M12 10l1.5-2"/></svg>今日</button>
  <button type="button" data-tab="graph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg>グラフ</button>
  <button type="button" data-tab="history"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>履歴</button>
  <button type="button" data-tab="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>設定</button>
</div></nav>

<div id="back" hidden>
  <section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var ACC='#0F766E', UP='#B45309', FLAT='#5F6661';
var DOW='日月火水木金土';
var DEFAULTS={heightCm:null,goalWeightKg:null,goalDate:'',startWeightKg:null,bodyFat:false};

/* ---------- date helpers (local time) ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]||1);}
function today(){return ymd(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function between(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function md(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();}
function dow(s){return DOW[parse(s).getDay()];}
function f1(v){return (v==null||!isFinite(v))?'—':(Math.round(v*10)/10).toFixed(1);}
function r1(v){return Math.round(v*10)/10;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:null;}

/* ---------- state ---------- */
var S={records:{},settings:Object.assign({},DEFAULTS),tab:'today',
  graph:{range:'1m',metric:'weight'},hist:{month:today().slice(0,7),mode:'list'},
  mode:'local',loading:false,note:'',csv:null};

function sorted(){return Object.keys(S.records).sort().map(function(k){return S.records[k];});}
function prevOf(date){var ks=Object.keys(S.records).sort(),p=null;for(var i=0;i<ks.length;i++){if(ks[i]<date)p=S.records[ks[i]];else break;}return p;}
function startWeight(){var s=S.settings.startWeightKg;if(s)return s;var a=sorted();return a.length?a[0].weightKg:null;}
function goalDir(){var g=S.settings.goalWeightKg,s=startWeight();if(g&&s&&g>s)return 1;return -1;}
function diffColor(d){if(Math.abs(d)<0.05)return FLAT;return (d*goalDir()>0)?ACC:UP;}
function diffBg(d){if(Math.abs(d)<0.05)return '#ECEFEC';return (d*goalDir()>0)?'var(--acc-soft)':'var(--up-soft)';}
function arrow(d){return Math.abs(d)<0.05?'±':(d<0?'▼':'▲');}
function diffText(d){return Math.abs(d)<0.05?'±0.0':(d<0?'−':'+')+f1(Math.abs(d));}
function avg7(date){var from=addDays(date,-6),s=0,n=0;for(var k in S.records){if(k>=from&&k<=date){s+=S.records[k].weightKg;n++;}}return n?s/n:null;}
function bmi(w){var h=S.settings.heightCm;return (h&&w)?w/Math.pow(h/100,2):null;}
function streak(){var d=today();if(!S.records[d])d=addDays(d,-1);var n=0;while(S.records[d]){n++;d=addDays(d,-1);}return n;}
function sanitize(v,id){var r={date:id,weightKg:Number(v.weightKg)};
  if(typeof v.bodyFatPct==='number')r.bodyFatPct=v.bodyFatPct;
  if(typeof v.memo==='string'&&v.memo)r.memo=v.memo.slice(0,100);
  r.recordedAt=Number(v.recordedAt)||0;r.updatedAt=Number(v.updatedAt)||0;return r;}

/* ---------- storage ---------- */
var LS='weightlog.v1', LS2='weightlog.v2', profileRef=null, recCol=null, chains={};
var P={profiles:[{id:'p1',name:'1人目'}],active:'p1',data:{p1:{records:{},settings:Object.assign({},DEFAULTS)}}};
function bind(){var d=P.data[P.active];S.records=d.records;S.settings=d.settings;}
function pname(id){var p=P.profiles.filter(function(x){return x.id===(id||P.active);})[0];return p?p.name:'';}
function multi(){return P.profiles.length>1;}
function switchTo(id){if(!P.data[id])return;P.active=id;bind();saveLocal();render();}
function cleanRecs(o){var r={};for(var k in (o||{})){var v=o[k];if(v&&isFinite(v.weightKg))r[k]=sanitize(v,k);}return r;}
function loadLocal(){try{
  var j2=JSON.parse(localStorage.getItem(LS2)||'null');
  if(j2&&j2.profiles&&j2.profiles.length){var data={};j2.profiles.forEach(function(p){var d=(j2.data||{})[p.id]||{};data[p.id]={records:cleanRecs(d.records),settings:Object.assign({},DEFAULTS,d.settings||{})};});
    P={profiles:j2.profiles.map(function(p){return {id:String(p.id),name:String(p.name||'').slice(0,12)||'名前なし'};}),active:data[j2.active]?j2.active:j2.profiles[0].id,data:data};}
  else{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j){P.data.p1={records:cleanRecs(j.records),settings:Object.assign({},DEFAULTS,j.settings||{})};}}
}catch(e){}bind();}
function saveLocal(){try{localStorage.setItem(LS2,JSON.stringify(P));}catch(e){}}
function serial(key,fn){var p=(chains[key]||Promise.resolve()).then(fn,fn);chains[key]=p.catch(function(){});return p;}
function writeErr(e){var c=e&&e.code;toast(c==='quota_exceeded'?'保存容量がいっぱいです':'保存できませんでした。通信を確認してください');}
function putRecord(rec){S.records[rec.date]=rec;render();
  if(S.mode==='cloud'){serial(rec.date,function(){return recCol.doc(rec.date).set(rec);}).catch(writeErr);}else saveLocal();}
function delRecord(date){delete S.records[date];render();
  if(S.mode==='cloud'){serial(date,function(){return recCol.doc(date).delete();}).catch(writeErr);}else saveLocal();}
function putSettings(){render();
  if(S.mode==='cloud'){var s=Object.assign({},S.settings);serial('profile',function(){return profileRef.set({settings:s});}).catch(writeErr);}else saveLocal();}

function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(res){
    var db=res[0],user=res[1];if(!db||!user)return null;
    return Promise.resolve(user.id()).then(function(uid){
      if(!uid)return;
      var local={records:S.records,settings:S.settings};
      profileRef=db.doc('data/users/'+uid+'/profile');
      recCol=profileRef.collection('records');
      S.mode='cloud';S.loading=true;render();
      var gotR=false,gotP=false,migrated=false;
      var timer=setTimeout(function(){S.note='データにまだ接続できません。表示が古い可能性があります。';render();},10000);
      function done(){if(gotR&&gotP){clearTimeout(timer);S.note='';S.loading=false;}}
      function fail(){clearTimeout(timer);S.loading=false;S.note='データを読み込めませんでした。時間をおいて開き直してください。';render();}
      recCol.onSnapshot(function(snap){
        var r={};snap.docs.forEach(function(d){var v=d.data();if(v&&isFinite(Number(v.weightKg)))r[d.id]=sanitize(v,d.id);});
        if(!snap.metadata.fromCache&&!migrated){migrated=true;
          var lk=Object.keys(local.records);
          if(snap.empty&&lk.length){lk.forEach(function(k){var rec=local.records[k];r[k]=rec;serial(k,function(){return recCol.doc(k).set(rec);}).catch(function(){});});}
        }
        S.records=r;if(!snap.metadata.fromCache){gotR=true;done();}render();
      },fail);
      profileRef.onSnapshot(function(snap){
        var s=snap.exists&&snap.data()?snap.data().settings:null;
        if(s)S.settings=Object.assign({},DEFAULTS,s);
        else if(!snap.metadata.fromCache&&!snap.exists&&local.settings&&(local.settings.goalWeightKg||local.settings.heightCm)){
          S.settings=Object.assign({},DEFAULTS,local.settings);var cp=Object.assign({},S.settings);
          serial('profile',function(){return profileRef.set({settings:cp});}).catch(function(){});
        }
        if(!snap.metadata.fromCache){gotP=true;done();}render();
      },fail);
    });
  }).catch(function(){});
}

/* ---------- UI helpers ---------- */
var view=document.getElementById('view');
var tt=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2200);}
var ICON={
  flame:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="'+ACC+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/></svg>',
  pen:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
  left:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',

var RANGES=[['1w','1週',7],['2w','2週',14],['1m','1ヶ月',30],['3m','3ヶ月',91],['1y','1年',365],['all','全期間',0]];
function metricVal(r,m){if(m==='weight')return r.weightKg;if(m==='fat')return (typeof r.bodyFatPct==='number')?r.bodyFatPct:null;if(m==='bmi')return bmi(r.weightKg);return null;}
function graphData(){
  var g=S.graph,rg=RANGES.filter(function(x){return x[0]===g.range;})[0],t=today();
  var all=sorted(),from=rg[2]?addDays(t,-(rg[2]-1)):(all.length?all[0].date:t);
  var pts=[];all.forEach(function(r){if(r.date>=from&&r.date<=t){var v=metricVal(r,g.metric);if(v!=null&&isFinite(v))pts.push({date:r.date,v:v});}});
  pts.forEach(function(p){var f=addDays(p.date,-6),s=0,n=0;pts.forEach(function(q){if(q.date>=f&&q.date<=p.date){s+=q.v;n++;}});p.avg=s/n;});
  return {from:from,to:t,pts:pts};
}
function regression(){ // kg/day over last 14 days
  var t=today(),f=addDays(t,-13),xs=[],ys=[];
  sorted().forEach(function(r){if(r.date>=f){xs.push(between(f,r.date));ys.push(r.weightKg);}});
  if(xs.length<4)return null;var n=xs.length,mx=0,my=0;xs.forEach(function(x,i){mx+=x;my+=ys[i];});mx/=n;my/=n;
  var nu=0,de=0;xs.forEach(function(x,i){nu+=(x-mx)*(ys[i]-my);de+=(x-mx)*(x-mx);});return de?nu/de:null;
}
function vGraph(){
  var g=S.graph,unit=g.metric==='fat'?'%':(g.metric==='bmi'?'':' kg');
  var h='<header class="hdr"><h1>グラフ</h1><div class="seg" role="group" aria-label="表示する値">'+

  h+='<div class="pills" role="group" aria-label="期間">'+RANGES.map(function(r){return '<button type="button" data-act="range" data-v="'+r[0]+'" aria-pressed="'+(g.range===r[0])+'">'+r[1]+'</button>';}).join('')+'</div>';
  if(S.note)h+='<p class="note">'+esc(S.note)+'</p>';
  var D=graphData(),p=D.pts;
  if(g.metric==='bmi'&&!S.settings.heightCm){return h+'<div class="card" style="margin:0 16px"><p class="empty">BMIを出すには、設定で身長を入れてください。</p></div>';}
  if(p.length<2){return h+'<div class="card" style="margin:0 16px"><p class="empty">'+(g.metric==='fat'?'体脂肪率の記録が2日分以上たまるとグラフが出ます。設定で「体脂肪率も記録する」をオンにできます。':'この期間の記録が2日分以上たまるとグラフが出ます。')+'</p></div>';}
  var first=p[0],lastp=p[p.length-1],ch=lastp.v-first.v,sum=0,mx=p[0],mn=p[0];
  p.forEach(function(q){sum+=q.v;if(q.v>mx.v)mx=q;if(q.v<mn.v)mn=q;});
  var dc=g.metric==='weight'?diffColor(ch):'var(--ink)';
  h+='<section class="card" style="margin:0 16px;padding:18px 14px 12px;display:flex;flex-direction:column;gap:12px">'+
    '<div style="display:flex;gap:24px;padding:0 6px"><div style="display:flex;flex-direction:column;gap:2px"><span class="muted" style="font-size:12px">期間の変化</span><span class="num" style="font-size:22px;font-weight:700;color:'+dc+'">'+diffText(ch)+'<span style="font-size:13px;font-weight:500">'+unit+'</span></span></div>'+
    '<div style="display:flex;flex-direction:column;gap:2px"><span class="muted" style="font-size:12px">期間平均</span><span class="num" style="font-size:22px;font-weight:700">'+f1(sum/p.length)+'<span class="muted" style="font-size:13px;font-weight:500">'+unit+'</span></span></div></div>'+
    '<div id="chart" style="position:relative"></div>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap;padding:0 6px;font-size:12px" class="muted">'+
      '<span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:3px;border-radius:2px;background:'+ACC+'"></span>'+(g.metric==='weight'?'体重':g.metric==='fat'?'体脂肪率':'BMI')+'</span>'+
      '<span style="display:flex;align-items:center;gap:6px"><span style="width:14px;border-top:2px dotted #9AA19C"></span>7日移動平均</span>'+
      (g.metric==='weight'&&S.settings.goalWeightKg?'<span style="display:flex;align-items:center;gap:6px"><span style="width:14px;border-top:2px dashed '+UP+'"></span>目標</span>':'')+
    '</div></section>';
  h+='<section style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 16px 0">'+
    '<div class="stat"><span class="l">最高</span><span class="v num">'+f1(mx.v)+unit+'</span><span class="l">'+md(mx.date)+'（'+dow(mx.date)+'）</span></div>'+
    '<div class="stat"><span class="l">最低</span><span class="v num">'+f1(mn.v)+unit+'</span><span class="l">'+md(mn.date)+'（'+dow(mn.date)+'）</span></div>';
  var goal=S.settings.goalWeightKg;
  if(g.metric==='weight'&&goal){
    var cur=sorted().slice(-1)[0],sl=regression(),msg;
    var remain=goal-cur.weightKg;
    if(goalDir()<0?cur.weightKg<=goal:cur.weightKg>=goal)msg='目標 '+f1(goal)+'kg を達成しています';
    else if(sl==null)msg='直近2週間に4日分以上の記録がたまると、目標に届く時期を予測します';
    else if(sl*remain>0&&Math.abs(sl)>0.005){var days=remain/sl,wk=Math.ceil(days/7),ed=addDays(today(),Math.round(days)),edd=parse(ed);
      msg='このペースだと目標 '+f1(goal)+'kg まで あと約 '+wk+'週間（'+edd.getFullYear()+'/'+(edd.getMonth()+1)+'/'+edd.getDate()+' ごろ）';}
    else msg='直近2週間は横ばいか、目標と逆の向きです';
    h+='<div style="grid-column:span 2;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--acc-soft)">'+ICON.trend+'<span style="font-size:13px;line-height:1.5;color:var(--acc-ink)">'+esc(msg)+'</span></div>';
  }
  h+='</section>';
  return h;
}
var CH=null;
function drawChart(){
  var el=document.getElementById('chart');if(!el)return;
  var D=graphData(),p=D.pts,g=S.graph;if(p.length<2)return;
  var W=Math.max(260,el.clientWidth),H=220,L=36,R=10,T=12,B=24;
  var lo=Infinity,hi=-Infinity;p.forEach(function(q){lo=Math.min(lo,q.v,q.avg);hi=Math.max(hi,q.v,q.avg);});
  var goal=(g.metric==='weight')?S.settings.goalWeightKg:null,goalIn=false;
  if(goal&&goal>=lo-5&&goal<=hi+5){lo=Math.min(lo,goal);hi=Math.max(hi,goal);goalIn=true;}
  var span=Math.max(hi-lo,1);lo-=span*0.12;hi+=span*0.12;
  var x0=parse(D.from).getTime(),x1=parse(D.to).getTime();if(x1===x0)x1=x0+86400000;
  function X(d){return L+(parse(d).getTime()-x0)/(x1-x0)*(W-L-R);}
  function Y(v){return T+(hi-v)/(hi-lo)*(H-T-B);}
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+md(p[0].date)+'から'+md(p[p.length-1].date)+'までの推移。'+f1(p[0].v)+'から'+f1(p[p.length-1].v)+'" style="display:block;touch-action:pan-y">';
  for(var i=0;i<3;i++){var v=lo+(hi-lo)*(0.15+0.35*i),y=Y(v);s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#ECEFEC"/><text x="0" y="'+(y+4)+'" font-size="10" fill="#5F6661" font-family="Inter,sans-serif">'+f1(v)+'</text>';}
  var mid=addDays(D.from,Math.round(between(D.from,D.to)/2));
  [[D.from,'start'],[mid,'middle'],[D.to,'end']].forEach(function(a){s+='<text x="'+X(a[0])+'" y="'+(H-6)+'" text-anchor="'+a[1]+'" font-size="10" fill="#5F6661" font-family="Inter,sans-serif">'+md(a[0])+'</text>';});
  if(goalIn){var gy=Y(goal);s+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="'+UP+'" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(gy-6)+'" text-anchor="end" font-size="10" font-weight="600" fill="'+UP+'" font-family="Inter,Noto Sans JP,sans-serif">目標 '+f1(goal)+'</text>';}
  if(p.length>=3)s+='<polyline points="'+p.map(function(q){return X(q.date).toFixed(1)+','+Y(q.avg).toFixed(1);}).join(' ')+'" fill="none" stroke="#9AA19C" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>';
  s+='<polyline points="'+p.map(function(q){return X(q.date).toFixed(1)+','+Y(q.v).toFixed(1);}).join(' ')+'" fill="none" stroke="'+ACC+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  if(p.length<=31)p.forEach(function(q){s+='<circle cx="'+X(q.date).toFixed(1)+'" cy="'+Y(q.v).toFixed(1)+'" r="2.5" fill="'+ACC+'"/>';});
  var lp=p[p.length-1];s+='<circle cx="'+X(lp.date)+'" cy="'+Y(lp.v)+'" r="5" fill="'+ACC+'" stroke="#fff" stroke-width="2"/>';
  s+='<g id="tip" visibility="hidden"><line id="tipl" y1="'+T+'" y2="'+(H-B)+'" stroke="#16181A" stroke-opacity=".25"/><circle id="tipc" r="5" fill="#fff" stroke="'+ACC+'" stroke-width="2.5"/></g>';
  s+='<rect x="'+L+'" y="0" width="'+(W-L-R)+'" height="'+H+'" fill="transparent" id="hit"/></svg>';
  s+='<div id="tipt" style="position:absolute;top:-6px;padding:4px 8px;border-radius:8px;background:#16181A;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;visibility:hidden;transform:translateX(-50%)"></div>';
  el.innerHTML=s;
  CH={p:p,X:X,Y:Y,W:W};
  var hit=el.querySelector('#hit');
  function show(ev){var r=el.getBoundingClientRect(),cx=(ev.clientX-r.left),best=null,bd=1e9;
    CH.p.forEach(function(q){var dd=Math.abs(CH.X(q.date)-cx);if(dd<bd){bd=dd;best=q;}});if(!best)return;
    var x=CH.X(best.date),y=CH.Y(best.v);
    var tip=el.querySelector('#tip');tip.setAttribute('visibility','visible');
    el.querySelector('#tipl').setAttribute('x1',x);el.querySelector('#tipl').setAttribute('x2',x);
    el.querySelector('#tipc').setAttribute('cx',x);el.querySelector('#tipc').setAttribute('cy',y);
    var t=el.querySelector('#tipt');t.textContent=md(best.date)+'（'+dow(best.date)+'） '+f1(best.v);t.style.visibility='visible';
    t.style.left=Math.min(Math.max(x,50),CH.W-50)+'px';}
  function hide(){var tip=el.querySelector('#tip');if(tip)tip.setAttribute('visibility','hidden');var t=el.querySelector('#tipt');if(t)t.style.visibility='hidden';}
  hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);hit.addEventListener('pointerleave',hide);
}

  h+='<section class="sec"><h2>記録する人</h2><div class="card sgroup">'+P.profiles.map(function(p,i){
    return '<div class="srow"><label for="pn-'+i+'" class="vh">'+(i+1)+'人目の名前</label><input id="pn-'+i+'" type="text" maxlength="12" data-pname="'+esc(p.id)+'" value="'+esc(p.name)+'" style="flex:1;width:auto;text-align:left">'+
      (multi()?'<button type="button" class="danger" style="padding:0 4px;white-space:nowrap" data-act="delp" data-v="'+esc(p.id)+'">'+(S.delP===p.id?'もう一度で削除':'削除')+'</button>':'')+'</div>';}).join('')+
    (P.profiles.length<6?'<button type="button" class="linkbtn" style="border-top:1px solid var(--line2);color:var(--acc);font-weight:600" data-act="addp">＋ 人を追加</button>':'')+
    '</div>'+(multi()?'<p class="muted" style="margin:4px 4px 0;font-size:12px">下の設定は「'+esc(pname())+'」の分です。上で人を切り替えられます。</p>':'')+'</section>';
  h+='<section class="sec"><h2>からだ・目標</h2><div class="card sgroup">'+
    '<div class="srow"><label for="i-goal">目標体重</label><span class="unitwrap"><input id="i-goal" class="num" type="number" inputmode="decimal" step="0.1" min="20" max="300" data-set="goalWeightKg" value="'+(g||'')+'" placeholder="未設定">kg</span></div>'+
    '<div class="srow"><label for="i-gdate">目標日</label><input id="i-gdate" type="date" data-set="goalDate" value="'+esc(s.goalDate||'')+'"></div>'+
    '<div class="srow"><label for="i-h">身長<span class="sub">BMIの計算に使います</span></label><span class="unitwrap"><input id="i-h" class="num" type="number" inputmode="decimal" step="0.1" min="80" max="250" data-set="heightCm" value="'+(s.heightCm||'')+'" placeholder="未設定">cm</span></div>'+
    '<div class="srow"><label for="i-st">開始体重<span class="sub">空欄なら最初の記録を使います</span></label><span class="unitwrap"><input id="i-st" class="num" type="number" inputmode="decimal" step="0.1" min="20" max="300" data-set="startWeightKg" value="'+(s.startWeightKg||'')+'" placeholder="'+(st?f1(st):'未設定')+'">kg</span></div>'+
    '</div></section>';
  h+='<section class="sec"><h2>記録</h2><div class="card sgroup">'+
    '<div class="srow"><span class="lab" id="l-bf">体脂肪率も記録する</span><button type="button" class="sw" role="switch" aria-labelledby="l-bf" aria-checked="'+(!!s.bodyFat)+'" data-act="bf"><span></span></button></div>'+
    '</div></section>';
  h+='<section class="sec"><h2>データ</h2><div class="card sgroup">'+
    '<button type="button" class="linkbtn" data-act="csv">CSVで書き出し（バックアップ）<span class="muted">'+Object.keys(S.records).length+'件 ›</span></button>'+
    '<label class="linkbtn" style="border-top:1px solid var(--line2);cursor:pointer">CSVから読み込み<span class="muted">›</span><input type="file" accept=".csv,text/csv,text/plain" data-act="import" class="vh"></label>'+
    '</div>';
  if(S.csv)h+='<div class="card" style="padding:12px;display:flex;flex-direction:column;gap:8px"><span style="font-size:13px" class="muted">ダウンロードできない環境のため、内容を表示しています。</span><textarea class="csv" readonly aria-label="CSVデータ">'+esc(S.csv)+'</textarea><button type="button" class="primary" style="height:44px;font-size:14px" data-act="copycsv">コピー</button></div>';
  h+='<p class="muted" style="margin:6px 4px 0;font-size:12px;line-height:1.6">'+'記録はこの端末の中だけに保存されます。機種変更やブラウザのデータ削除に備えて、ときどきCSVで書き出しておくと安心です。'+'</p><p class="muted" style="margin:10px 4px 0;font-size:11px">バージョン 1.2</p></section>';
  return h;
}

var lastTab=null;
function render(){
  var ae=document.activeElement;
  if(S.tab==='settings'&&lastTab==='settings'&&ae&&ae.tagName==='INPUT'&&view.contains(ae)){pending=true;return;}
  pending=false;
  var y=window.scrollY;
  view.classList.toggle('t-today',S.tab==='today');document.documentElement.classList.toggle('t-today',S.tab==='today');
  view.innerHTML=S.tab==='today'?vToday():S.tab==='graph'?vGraph():S.tab==='history'?vHistory():vSettings();
  if(S.tab==='graph')drawChart();
  if(lastTab===S.tab)window.scrollTo(0,y);else window.scrollTo(0,0);
  lastTab=S.tab;
  document.querySelectorAll('.tabs button').forEach(function(b){if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(E.open)renderSheet();
}
var pending=false;

/* ---------- sheet (record input) ---------- */
var E={open:false};
function openSheet(date){
  var rec=S.records[date],pv=prevOf(date);
  E={open:true,date:date,existed:!!rec,buf:rec?f1(rec.weightKg):'',fresh:true,base:rec?rec.weightKg:(pv?pv.weightKg:null),
     fat:rec&&typeof rec.bodyFatPct==='number'?f1(rec.bodyFatPct):'',memo:rec&&rec.memo||'',confirmDel:false,recordedAt:rec?rec.recordedAt:0};
  document.getElementById('back').hidden=false;document.body.style.overflow='hidden';
  renderSheet(true);
  document.addEventListener('keydown',onKey);
}
function closeSheet(){E.open=false;document.getElementById('back').hidden=true;document.body.style.overflow='';document.removeEventListener('keydown',onKey);}
function curVal(){var v=num(E.buf);return v;}
function sheetHint(){
  var v=curVal(),pv=prevOf(E.date);
  if(E.buf==='')return {t:E.base?'前回 '+f1(E.base)+' kg':'体重を入力してください',c:FLAT};
  if(v==null||v<20||v>300)return {t:'20〜300kg の範囲で入力してください',c:UP};
  if(!pv)return {t:'はじめての記録',c:FLAT};
  var d=r1(v-pv.weightKg),n=between(pv.date,E.date);
  return {t:(n===1?'前日':n+'日前')+' '+f1(pv.weightKg)+' kg から '+diffText(d),c:diffColor(d)};
}
function renderSheet(focus){
  var sh=document.getElementById('sheet'),v=curVal(),ok=v!=null&&v>=20&&v<=300,hint=sheetHint(),t=today();
  var disp=E.buf!==''?esc(E.buf):(E.base?'<span style="color:#C7CCC8">'+f1(E.base)+'</span>':'<span style="color:#C7CCC8">--.-</span>');
  var h='<div class="grab"></div><div class="shd"><button type="button" class="txtbtn" data-sact="close">キャンセル</button><span class="t" id="sheet-title">'+(multi()?esc(pname())+'の':'')+(E.existed?'記録を編集':'体重を記録')+'</span>'+
    '<label class="vh" for="s-date">日付</label><input id="s-date" class="datein" type="date" max="'+t+'" value="'+E.date+'"></div>'+
    '<div class="disp"><button type="button" class="round" data-sact="dec" aria-label="0.1kg 減らす">'+ICON.minus+'</button>'+
    '<div class="dval"><div class="big"><span class="n num" aria-live="polite">'+disp+'</span><span class="k">kg</span></div><span class="hint" style="color:'+hint.c+'">'+esc(hint.t)+'</span></div>'+
    '<button type="button" class="round" data-sact="inc" aria-label="0.1kg 増やす">'+ICON.plus+'</button></div>'+
    '<div class="pad">'+['1','2','3','4','5','6','7','8','9','.','0'].map(function(k){return '<button type="button" data-key="'+k+'">'+k+'</button>';}).join('')+
    '<button type="button" data-key="del" aria-label="1文字消す">'+ICON.back+'</button></div>'+
    '<div class="extra">'+(S.settings.bodyFat?'<label><span>体脂肪率</span><input id="s-fat" class="num" type="number" inputmode="decimal" step="0.1" min="3" max="70" placeholder="任意（%）" value="'+esc(E.fat)+'"></label>':'')+
    '<label><span>メモ</span><input id="s-memo" type="text" maxlength="100" placeholder="任意（例：前日 飲み会）" value="'+esc(E.memo)+'"></label></div>'+
    '<button type="button" class="primary" data-sact="save"'+(ok?'':' disabled')+'>保存する</button>'+
    (E.existed?'<button type="button" class="danger" data-sact="del">'+(E.confirmDel?'もう一度押すと削除します':'この日の記録を削除')+'</button>':'');
  var fa=document.activeElement&&document.activeElement.id;
  sh.innerHTML=h;
  if(fa==='s-memo'||fa==='s-fat'){var el=document.getElementById(fa);if(el){el.focus();var L=el.value.length;try{el.setSelectionRange(L,L);}catch(e){}}}
}
function press(k){
  if(k==='del'){E.buf=E.fresh?'':E.buf.slice(0,-1);E.fresh=false;}
  else if(k==='.'){if(E.fresh){E.buf='';E.fresh=false;}if(E.buf!==''&&E.buf.indexOf('.')<0)E.buf+='.';}
  else{if(E.fresh){E.buf='';E.fresh=false;}var parts=E.buf.split('.');
    if(parts.length===2){if(parts[1].length<1)E.buf+=k;}
    else if(parts[0].length<3){E.buf=(E.buf==='0'?'':E.buf)+k;}}
  E.confirmDel=false;renderSheet();
}
function step(d){var v=curVal();if(v==null)v=E.base||60;v=r1(v+d);if(v<20)v=20;if(v>300)v=300;E.buf=f1(v);E.fresh=false;E.confirmDel=false;renderSheet();}
function save(){
  var v=curVal();if(v==null||v<20||v>300)return;
  var rec={date:E.date,weightKg:r1(v),recordedAt:E.recordedAt||Date.now(),updatedAt:Date.now()};
  var memo=(document.getElementById('s-memo')||{}).value;if(memo&&memo.trim())rec.memo=memo.trim().slice(0,100);
  var fe=document.getElementById('s-fat');if(fe){var f=num(fe.value);if(f!=null&&f>=3&&f<=70)rec.bodyFatPct=r1(f);}
  else{var old=S.records[E.date];if(old&&typeof old.bodyFatPct==='number')rec.bodyFatPct=old.bodyFatPct;}
  closeSheet();putRecord(rec);toast((multi()?pname()+'：':'')+md(rec.date)+' '+f1(rec.weightKg)+'kg を保存しました');
}
function onKey(e){
  if(!E.open)return;var tg=e.target&&e.target.tagName;if(tg==='INPUT')return;
  if(/^[0-9]$/.test(e.key)){press(e.key);e.preventDefault();}
  else if(e.key==='.'||e.key===','){press('.');e.preventDefault();}
  else if(e.key==='Backspace'){press('del');e.preventDefault();}
  else if(e.key==='Enter'){save();e.preventDefault();}
  else if(e.key==='Escape'){closeSheet();}
  else if(e.key==='ArrowUp'){step(0.1);e.preventDefault();}
  else if(e.key==='ArrowDown'){step(-0.1);e.preventDefault();}
}
document.getElementById('sheet').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.key){press(b.dataset.key);return;}
  var a=b.dataset.sact;
  if(a==='close')closeSheet();else if(a==='inc')step(0.1);else if(a==='dec')step(-0.1);else if(a==='save')save();
  else if(a==='del'){if(!E.confirmDel){E.confirmDel=true;renderSheet();}else{var d=E.date;closeSheet();delRecord(d);toast(md(d)+' の記録を削除しました');}}
});
document.getElementById('sheet').addEventListener('input',function(e){
  if(e.target.id==='s-memo')E.memo=e.target.value;if(e.target.id==='s-fat')E.fat=e.target.value;
});
document.getElementById('sheet').addEventListener('change',function(e){
  if(e.target.id==='s-date'){var d=e.target.value;if(d&&d<=today())openSheet(d);else renderSheet();}
});
document.getElementById('back').addEventListener('click',function(e){if(e.target.id==='back')closeSheet();});

/* ---------- main events ---------- */
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;if(S.tab==='history')S.hist.month=S.hist.month||today().slice(0,7);render();});
view.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;var a=b.dataset.act,v=b.dataset.v;
  if(a==='open')openSheet(b.dataset.date);
  else if(a==='metric'){S.graph.metric=v;render();}
  else if(a==='range'){S.graph.range=v;render();}
  else if(a==='hmode'){S.hist.mode=v;render();}
  else if(a==='month'){var y=+S.hist.month.slice(0,4),m=+S.hist.month.slice(5,7)-1+Number(v);var d=new Date(y,m,1);var ym=d.getFullYear()+'-'+pad(d.getMonth()+1);if(ym<=today().slice(0,7)){S.hist.month=ym;render();}}
  else if(a==='bf'){S.settings.bodyFat=!S.settings.bodyFat;putSettings();}
  else if(a==='who'){S.delP=null;switchTo(v);toast(pname()+' に切り替えました');}
  else if(a==='addp'){var id='p'+Date.now().toString(36);P.profiles.push({id:id,name:(P.profiles.length+1)+'人目'});P.data[id]={records:{},settings:Object.assign({},DEFAULTS)};S.delP=null;switchTo(id);
    setTimeout(function(){var el=document.querySelector('[data-pname="'+id+'"]');if(el){el.focus();el.select();}},50);}
  else if(a==='delp'){if(S.delP!==v){S.delP=v;render();return;}
    var nm=pname(v);P.profiles=P.profiles.filter(function(x){return x.id!==v;});delete P.data[v];S.delP=null;
    if(P.active===v)P.active=P.profiles[0].id;bind();saveLocal();render();toast(nm+' を削除しました');}
  else if(a==='csv')exportCsv();
  else if(a==='copycsv'){try{navigator.clipboard.writeText(S.csv).then(function(){toast('コピーしました');},function(){toast('コピーできませんでした。長押しで選択してください');});}catch(err){toast('コピーできませんでした');}}
});
view.addEventListener('change',function(e){
  if(e.target.dataset&&e.target.dataset.act==='import'){var f=e.target.files&&e.target.files[0];if(f)importCsv(f);e.target.value='';return;}
  var pid=e.target.dataset&&e.target.dataset.pname;
  if(pid){var nm=e.target.value.trim().slice(0,12);P.profiles.forEach(function(p){if(p.id===pid&&nm)p.name=nm;});saveLocal();render();toast('名前を変えました');return;}
  var k=e.target.dataset&&e.target.dataset.set;if(!k)return;var val=e.target.value;
  if(k==='goalDate')S.settings.goalDate=val||'';
  else{var n=num(val);var lim=k==='heightCm'?[80,250]:[20,300];S.settings[k]=(n!=null&&n>=lim[0]&&n<=lim[1])?r1(n):null;}
  putSettings();toast('保存しました');
});
view.addEventListener('focusout',function(){setTimeout(function(){if(pending)render();},0);});
document.addEventListener('touchmove',function(e){if(S.tab==='today'&&!E.open)e.preventDefault();},{passive:false});
window.addEventListener('resize',function(){if(S.tab==='graph')drawChart();});

function csvText(){
  var q=function(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  return 'date,weight_kg,body_fat_pct,memo\n'+sorted().map(function(r){return [r.date,f1(r.weightKg),typeof r.bodyFatPct==='number'?f1(r.bodyFatPct):'',q(r.memo||'')].join(',');}).join('\n')+'\n';
}
function exportCsv(){
  if(!Object.keys(S.records).length){toast('まだ記録がありません');return;}
  var txt=csvText(),name='weight-'+(multi()?pname()+'-':'')+today()+'.csv';
  try{var blob=new Blob(['\ufeff'+txt],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('書き出しました');}
  catch(e){S.csv=txt;render();}
}
function parseCsvLine(line){var out=[],cur='',q=false;for(var i=0;i<line.length;i++){var c=line[i];
  if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;else if(c===','){out.push(cur);cur='';}else cur+=c;}out.push(cur);return out;}
function importCsv(file){
  var rd=new FileReader();
  rd.onload=function(){
    var lines=String(rd.result).replace(/^\ufeff/,'').split(/\r?\n/),n=0;
    lines.forEach(function(l){if(!l.trim())return;var c=parseCsvLine(l);var d=(c[0]||'').trim(),w=num(c[1]);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||w==null||w<20||w>300)return;
      var r={date:d,weightKg:r1(w),recordedAt:0,updatedAt:Date.now()};var f=num(c[2]);if(f!=null&&f>=3&&f<=70)r.bodyFatPct=r1(f);
      if(c[3]&&c[3].trim())r.memo=c[3].trim().slice(0,100);S.records[d]=r;n++;});
    saveLocal();render();toast(n?n+'件を読み込みました':'読み込める記録がありませんでした');
  };
  rd.readAsText(file);
}
/* ---------- day change: refresh at midnight / on return ---------- */
var shownDay=today();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&today()!==shownDay){shownDay=today();render();}});
setInterval(function(){if(today()!==shownDay){shownDay=today();render();}},60000);

loadLocal();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
